<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ระบบใบเสนอราคา – ทดสอบ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans+Thai+Looped:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: app shell — sidebar nav on desktop, bottom tab bar on phones; content column holds list / form / document views */
  :root {
    --ocean-l: #1f5fae; --ocean-d: #7fb2f0;
    --forest-l: #1d7a55; --forest-d: #6fd3a6;
    --sunset-l: #c2560f; --sunset-d: #f5a462;
    --plum-l: #7a3fa8; --plum-d: #c9a0ef;
    --acc-l: var(--ocean-l); --acc-d: var(--ocean-d);

    --bg: #f3f5f8; --surface: #ffffff; --surface-2: #f8f9fb; --fg: #1b2230; --muted: #5f6b7c; --line: #dfe3ea;
    --accent: var(--acc-l); --accent-fg: #ffffff;
    --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--surface));
    --ok: #1f7a4a; --warn: #a96500; --bad: #b3261e; --info: #3a5a8c;
    --shadow: 0 1px 2px rgba(20,30,50,.06), 0 4px 16px rgba(20,30,50,.06);
    --display: 'IBM Plex Sans Thai', 'Tahoma', sans-serif;
    --body: 'IBM Plex Sans Thai Looped', 'IBM Plex Sans Thai', 'Tahoma', sans-serif;
  }
  :root[data-palette="forest"] { --acc-l: var(--forest-l); --acc-d: var(--forest-d); }
  :root[data-palette="sunset"] { --acc-l: var(--sunset-l); --acc-d: var(--sunset-d); }
  :root[data-palette="plum"]   { --acc-l: var(--plum-l);   --acc-d: var(--plum-d); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #11151b; --surface: #1a2028; --surface-2: #151a21; --fg: #e6eaf0; --muted: #9ba6b5; --line: #2c3540;
    --accent: var(--acc-d); --accent-fg: #0e141b;
    --ok: #6fd39c; --warn: #f0b860; --bad: #f19a92; --info: #9dbbe8;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #11151b; --surface: #1a2028; --surface-2: #151a21; --fg: #e6eaf0; --muted: #9ba6b5; --line: #2c3540;
    --accent: var(--acc-d); --accent-fg: #0e141b;
    --ok: #6fd39c; --warn: #f0b860; --bad: #f19a92; --info: #9dbbe8;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); color-scheme: dark }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body); }
  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
  h1 { font-size: 1.45rem; font-weight: 600; }
  h2 { font-size: 1.05rem; font-weight: 600; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100%; }
  .side {
    background: var(--surface); border-right: 1px solid var(--line); padding: 20px 12px;
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
  .logo { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-fg);
    display: grid; place-items: center; font: 600 1rem var(--display); }
  .brand b { font-family: var(--display); display: block; line-height: 1.2; }
  .brand small { color: var(--muted); font-size: .75rem; }
  .nav { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border-radius: 8px; border: 0;
    background: none; cursor: pointer; text-align: left; color: var(--muted); font-family: var(--display); font-weight: 500; }
  .nav svg { width: 18px; height: 18px; flex: none; }
  .nav:hover { background: var(--surface-2); color: var(--fg); }
  .nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .side .spacer { flex: 1; }
  .newbtn { margin-bottom: 10px; justify-content: center; }

  main { min-width: 0; padding-block: 24px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .view { max-width: 1040px; margin: 0 auto; display: grid; gap: 16px; }
  .head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .head p { margin: 2px 0 0; color: var(--muted); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; min-width: 0; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  label.f { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
  input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
  textarea { resize: vertical; min-height: 60px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; padding: 9px 16px; cursor: pointer;
    font-family: var(--display); font-weight: 500; border: 1px solid var(--line); background: var(--surface); }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.small { padding: 5px 10px; font-size: .85rem; }
  .btn.link { border: 0; background: none; color: var(--accent); padding: 4px 0; }
  .btn svg { width: 16px; height: 16px; }
  .icon-btn { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 6px; border-radius: 6px; }
  .icon-btn:hover { color: var(--bad); background: var(--surface-2); }

  .chips { display: flex; gap: 6px; overflow-x: auto; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: .85rem; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; padding: 2px 10px; border-radius: 999px; white-space: nowrap;
    background: color-mix(in srgb, currentColor 12%, transparent); }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .st-draft { color: var(--muted); } .st-wait { color: var(--warn); } .st-ok { color: var(--ok); } .st-cancel { color: var(--bad); } .st-done { color: var(--info); }
  .tag { font: 500 .72rem var(--display); letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 5px; }

  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { font: 500 .8rem var(--display); color: var(--muted); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
  .sub { color: var(--muted); font-size: .82rem; }
  .empty { text-align: center; color: var(--muted); padding: 28px 12px; }

  .stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat b { display: block; font: 600 1.3rem var(--display); font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: .82rem; }

  /* Pickers */
  .picker { position: relative; }
  .menu { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); max-height: 280px; overflow-y: auto; padding: 4px; }
  .opt { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 7px; cursor: pointer; }
  .opt:hover, .opt.hl { background: var(--accent-soft); }
  .opt.add { color: var(--accent); font-weight: 500; }
  .selected-cust { display: grid; gap: 2px; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); }
  .selected-cust b { font-family: var(--display); }
  .addline { display: grid; grid-template-columns: 1fr 90px auto; gap: 8px; align-items: end; }
  .lines input { padding: 6px 8px; }
  .lines .q { width: 80px; } .lines .p { width: 120px; }
  .totals { display: grid; gap: 6px; width: 100%; max-width: 360px; margin-left: auto; }
  .totals div { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
  .totals .grand { border-top: 1px solid var(--line); padding-top: 8px; font: 600 1.15rem var(--display); color: var(--accent); }
  .words { text-align: right; color: var(--muted); font-size: .9rem; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }

  /* Document paper */
  .paper { background: #ffffff; color: #1b2230; border-radius: 6px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 44px); display: grid; gap: 22px; max-width: 820px; width: 100%; margin: 0 auto; border-top: 6px solid var(--acc-l); }
  .paper .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; }
  .paper h2 { color: var(--acc-l); font-size: 1.4rem; }
  .paper .muted { color: #5f6b7c; font-size: .85rem; }
  .paper table th { color: #5f6b7c; border-color: #dfe3ea; }
  .paper table td { border-color: #eceff3; }
  .paper .meta { display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-size: .9rem; align-content: start; }
  .paper .grand { color: var(--acc-l); }
  .paper .totals div { color: #1b2230; }
  .signs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 24px; padding-top: 24px; }
  .signs div { border-top: 1px dashed #b8c0cc; padding-top: 6px; text-align: center; font-size: .85rem; color: #5f6b7c; }

  /* Theme swatches */
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
  .sw i { width: 26px; height: 26px; border-radius: 7px; display: block; }
  .sw[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--fg); width: min(520px, calc(100% - 32px)); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(10, 15, 25, .45); }
  dialog form { padding: 20px; display: grid; gap: 12px; }
  .toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }

  @media (min-width: 861px) { .toast { bottom: 24px; } .only-mobile { display: none !important; } }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; z-index: 30; inset: auto 0 0 0; height: auto; flex-direction: row; justify-content: space-around; padding: 6px 4px;
      padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); border-right: 0; border-top: 1px solid var(--line); }
    .brand, .side .spacer, .newbtn { display: none; }
    .nav { flex-direction: column; gap: 2px; font-size: .72rem; padding: 6px 4px; text-align: center; width: auto; flex: 1; }
    main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
    .hide-sm { display: none; }
    .addline { grid-template-columns: 1fr 70px; } .addline .btn { grid-column: 1 / -1; justify-content: center; }
    .lines thead { display: none; }
    .lines tr { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .lines td { border: 0; padding: 0; }
    .lines td.n { grid-column: 1 / -1; }
    .lines .q, .lines .p { width: 100%; }
  }
  @media (prefers-reduced-motion: no-preference) { .view { animation: in .18s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(4px); } } }
</style>
</head>
<body>

<script>

};

/* ---------- Helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => (+n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function iso(d) { return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); }
function yymm(d) { return String(d.getFullYear() + 543).slice(-2) + String(d.getMonth() + 1).padStart(2, '0'); }
const thDate = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
const cust = id => db.customers.find(c => c.id === id);
const nextId = (arr, p) => p + String(arr.reduce((m, x) => Math.max(m, +x.id.slice(1)), 0) + 1).padStart(3, '0');

function nextDocNo(type, dateStr) {
  const prefix = type + yymm(new Date(dateStr + 'T00:00:00')) + '-';
  const max = db.docs.filter(d => d.no.startsWith(prefix)).reduce((m, d) => Math.max(m, +d.no.slice(prefix.length)), 0);
  return prefix + String(max + 1).padStart(4, '0');
}
function totals(doc) {
  const sum = doc.lines.reduce((s, l) => s + (+l.qty || 0) * (+l.price || 0), 0);
  const after = Math.max(0, sum - (+doc.discount || 0));
  let base = after, vat = 0;
  if (doc.vatMode === 'ex') vat = Math.round(after * 7) / 100;
  if (doc.vatMode === 'in') { base = Math.round(after / 1.07 * 100) / 100; vat = Math.round((after - base) * 100) / 100; }
  return { sum, after, base, vat, grand: doc.vatMode === 'ex' ? after + vat : after };
}
function thaiNum(num, hasHigher) {
  const dg = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'], ps = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
  if (num >= 1e6) return thaiNum(Math.floor(num / 1e6), hasHigher) + 'ล้าน' + thaiNum(num % 1e6, true);
  const s = String(num); let o = '';
  for (let i = 0; i < s.length; i++) {
    const d = +s[i], p = s.length - i - 1;
    if (!d) continue;
    if (p === 1 && d === 1) o += 'สิบ';
    else if (p === 1 && d === 2) o += 'ยี่สิบ';
    else if (p === 0 && d === 1 && (s.length > 1 || hasHigher)) o += 'เอ็ด';
    else o += dg[d] + ps[p];
  }
  return o;
}
function bahtText(n) {
  const t = Math.round(n * 100), b = Math.floor(t / 100), s = t % 100;
  if (!b && !s) return 'ศูนย์บาทถ้วน';
  return (b ? thaiNum(b) + 'บาท' : '') + (s ? thaiNum(s) + 'สตางค์' : 'ถ้วน');
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2800); }
const pill = s => `<span class="pill ${STATUS[s][1]}">${STATUS[s][0]}</span>`;

function addLine(p) {

  if (ex) ex.qty += qty; else draft.lines.push({ pid: p.id, name: p.name, unit: p.unit, qty, price: p.price });
  $('#pq').value = 1; drawLines(); toast(`เพิ่ม ${p.name} แล้ว`);
}

    <td class="num amt">${money(l.qty * l.price)}</td>
    <td><button class="icon-btn" data-del="${i}" type="button" aria-label="ลบรายการ">✕</button></td></tr>`).join('')

  document.querySelectorAll('#lines input').forEach(inp => inp.oninput = () => {
    draft.lines[inp.dataset.i][inp.dataset.k] = +inp.value || 0;
    const l = draft.lines[inp.dataset.i]; inp.closest('tr').querySelector('.amt').textContent = money(l.qty * l.price); drawTotals();
  });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { draft.lines.splice(+b.dataset.del, 1); drawLines(); });
  drawTotals();
}
function drawTotals() { const t = totals(draft); $('#tot').innerHTML = totalsHtml(draft, t).replace(/^<div class="totals">|<\/div>$/g, ''); $('#words').textContent = `(${bahtText(t.grand)})`; }
function commit(status) {
  syncDraft();
  if (!cust(draft.custId)) { toast('กรุณาเลือกลูกค้าจากฐานข้อมูล'); $('#cs')?.focus(); return; }
  if (!draft.lines.length) { toast('กรุณาเพิ่มรายการสินค้าอย่างน้อย 1 รายการ'); $('#ps').focus(); return; }
  const doc = { ...draft, no: nextDocNo(draft.type, draft.date), status, discount: +draft.discount || 0 };
  if (doc.ref) { const src = db.docs.find(x => x.no === doc.ref); if (src && src.status !== 'cancel') src.status = 'done'; }
  db.docs.push(doc); save(); draft = null;
  toast(`บันทึก ${TYPES[doc.type].name} เลขที่ ${doc.no} แล้ว`);
  go('doc', doc.no);
}

/* ---------- Customers ---------- */
let custSearch = '';
function viewCustomers() {
  const q = custSearch.toLowerCase();
  const list = db.customers.filter(c => !q || (c.name + c.tax + c.contact + c.phone).toLowerCase().includes(q));
  $('#main').innerHTML = `<div class="view">
    <div class="head"><div><h1>ฐานข้อมูลลูกค้า</h1><p>${db.customers.length} ราย · ออกเอกสารได้เฉพาะลูกค้าในรายการนี้</p></div><button class="btn primary" id="add">+ เพิ่มลูกค้า</button></div>
    <div class="card"><input id="s" type="search" placeholder="ค้นหาชื่อ เลขผู้เสียภาษี ผู้ติดต่อ" value="${esc(custSearch)}">
      <div class="tablewrap"><table><thead><tr><th>รหัส</th><th>ชื่อลูกค้า</th><th class="hide-sm">เลขผู้เสียภาษี</th><th class="hide-sm">ติดต่อ</th><th class="num">เอกสาร</th></tr></thead>
      <tbody>${list.map(c => `<tr class="click" data-id="${c.id}" tabindex="0"><td class="sub">${c.id}</td><td><b>${esc(c.name)}</b><div class="sub">${esc(c.addr)}</div></td>
        <td class="hide-sm">${esc(c.tax)}<div class="sub">${esc(c.branch)}</div></td><td class="hide-sm">${esc(c.contact)}<div class="sub">${esc(c.phone)}</div></td>
        <td class="num">${db.docs.filter(d => d.custId === c.id).length}</td></tr>`).join('') || `<tr><td colspan="5" class="empty">ไม่พบลูกค้า</td></tr>`}</tbody></table></div></div></div>`;
  $('#add').onclick = () => customerDialog(null, '', viewCustomers);
  $('#s').oninput = e => { custSearch = e.target.value; const p = e.target.selectionStart; viewCustomers(); $('#s').focus(); $('#s').setSelectionRange(p, p); };
  document.querySelectorAll('tr[data-id]').forEach(tr => { tr.onclick = () => customerDialog(cust(tr.dataset.id), '', viewCustomers); tr.onkeydown = e => e.key === 'Enter' && tr.onclick(); });
}
function customerDialog(c, name, done) {
  const v = c || { name, tax: '', branch: 'สำนักงานใหญ่', addr: '', contact: '', phone: '' };
  openDialog(`<h2>${c ? 'แก้ไขลูกค้า ' + c.id : 'เพิ่มลูกค้าใหม่'}</h2>
    <label class="f">ชื่อลูกค้า / บริษัท * <input name="name" required value="${esc(v.name)}"></label>
    <div class="grid"><label class="f">เลขประจำตัวผู้เสียภาษี (13 หลัก) <input name="tax" inputmode="numeric" maxlength="13" pattern="\\d{13}" value="${esc(v.tax)}"></label>
      <label class="f">สาขา <input name="branch" value="${esc(v.branch)}"></label></div>
    <label class="f">ที่อยู่ <textarea name="addr">${esc(v.addr)}</textarea></label>
    <div class="grid"><label class="f">ผู้ติดต่อ <input name="contact" value="${esc(v.contact)}"></label><label class="f">โทรศัพท์ <input name="phone" inputmode="tel" value="${esc(v.phone)}"></label></div>`,
    data => {
      if (c) Object.assign(c, data); else { c = { id: nextId(db.customers, 'C'), ...data }; db.customers.push(c); }
      save(); toast(`บันทึกลูกค้า ${c.name} ลงฐานข้อมูลแล้ว`); done(c);
    });
}

/* ---------- Products ---------- */
let prodSearch = '';
function viewProducts() {
  const q = prodSearch.toLowerCase();
  const list = db.products.filter(p => !q || (p.name + p.code).toLowerCase().includes(q));
  $('#main').innerHTML = `<div class="view">
    <div class="head"><div><h1>ฐานข้อมูลสินค้า / บริการ</h1><p>${db.products.length} รายการ · สินค้าที่เพิ่มจากหน้าสร้างเอกสารจะมาอยู่ที่นี่ด้วย</p></div><button class="btn primary" id="add">+ เพิ่มสินค้า</button></div>
    <div class="card"><input id="s" type="search" placeholder="ค้นหาชื่อหรือรหัสสินค้า" value="${esc(prodSearch)}">
      <div class="tablewrap"><table><thead><tr><th>รหัสสินค้า</th><th>ชื่อสินค้า</th><th>หน่วย</th><th class="num">ราคา/หน่วย</th></tr></thead>
      <tbody>${list.map(p => `<tr class="click" data-id="${p.id}" tabindex="0"><td><span class="tag">${esc(p.code)}</span></td><td>${esc(p.name)}</td><td>${esc(p.unit)}</td><td class="num">${money(p.price)}</td></tr>`).join('') || `<tr><td colspan="4" class="empty">ไม่พบสินค้า</td></tr>`}</tbody></table></div></div></div>`;
  $('#add').onclick = () => productDialog(null, '', viewProducts);
  $('#s').oninput = e => { prodSearch = e.target.value; const p = e.target.selectionStart; viewProducts(); $('#s').focus(); $('#s').setSelectionRange(p, p); };
  document.querySelectorAll('tr[data-id]').forEach(tr => { tr.onclick = () => productDialog(db.products.find(p => p.id === tr.dataset.id), '', viewProducts); tr.onkeydown = e => e.key === 'Enter' && tr.onclick(); });
}
function productDialog(p, name, done) {
  const v = p || { code: '', name, unit: 'ชิ้น', price: '' };
  openDialog(`<h2>${p ? 'แก้ไขสินค้า' : 'เพิ่มสินค้าใหม่เข้าฐานข้อมูล'}</h2>
    <label class="f">ชื่อสินค้า / บริการ * <input name="name" required value="${esc(v.name)}"></label>
    <div class="grid"><label class="f">รหัสสินค้า <input name="code" value="${esc(v.code)}" placeholder="เว้นว่างให้ระบบตั้งให้"></label>
      <label class="f">หน่วย * <input name="unit" required value="${esc(v.unit)}"></label>
      <label class="f">ราคา/หน่วย (บาท) * <input name="price" type="number" min="0" step="0.01" required value="${v.price}" inputmode="decimal"></label></div>`,
    data => {
      data.price = +data.price || 0;
      if (p) Object.assign(p, data);
      else { p = { id: nextId(db.products, 'P'), ...data }; if (!p.code) p.code = 'SKU-' + p.id.slice(1); db.products.push(p); }
      save(); toast(`บันทึกสินค้า ${p.name} ลงฐานข้อมูลแล้ว`); done(p);
    });
}

/* ---------- Dialog ---------- */
function openDialog(html, onSave) {
  const dlg = $('#dlg'), f = $('#dlgForm');
  f.innerHTML = html + `<div class="bar"><button class="btn" value="cancel" formnovalidate>ยกเลิก</button><button class="btn primary" value="ok">บันทึกลงฐานข้อมูล</button></div>`;
  f.onsubmit = e => {
    if (e.submitter?.value !== 'ok') return;
    e.preventDefault();
    if (!f.reportValidity()) return;
    const data = Object.fromEntries(new FormData(f)); Object.keys(data).forEach(k => data[k] = String(data[k]).trim());
    dlg.close(); onSave(data);
  };
  dlg.showModal(); f.querySelector('input')?.focus();
}

/* ---------- Theme settings ---------- */
const PALETTES = { ocean: ['น้ำเงินมหาสมุทร', '--ocean-l'], forest: ['เขียวป่า', '--forest-l'], sunset: ['ส้มอาทิตย์', '--sunset-l'], plum: ['ม่วงพลัม', '--plum-l'] };
const pref = { palette: 'ocean', mode: 'system' };
function applyTheme() {
  document.documentElement.dataset.palette = pref.palette;
  if (pref.mode === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = pref.mode;
  try { localStorage.setItem('qs-theme', JSON.stringify(pref)); } catch (e) {}
}
function viewSettings() {
  $('#main').innerHTML = `<div class="view">
    <div class="head"><div><h1>ธีมและการตั้งค่า</h1><p>เลือกสีหลักและโหมดการแสดงผล</p></div></div>
    <div class="card"><h2>สีธีม</h2><div class="swatches">${Object.entries(PALETTES).map(([k, [n, v]]) => `<button class="sw" data-p="${k}" aria-pressed="${pref.palette === k}"><i style="background:var(${v})"></i>${n}</button>`).join('')}</div></div>
    <div class="card"><h2>โหมดแสดงผล</h2><div class="chips">${[['system', 'ตามเครื่อง'], ['light', 'สว่าง'], ['dark', 'มืด']].map(([k, n]) => `<button class="chip" data-m="${k}" aria-pressed="${pref.mode === k}">${n}</button>`).join('')}</div></div>
    <div class="card"><h2>ข้อมูลทดสอบ</h2><p class="sub" style="margin:0">ลูกค้า สินค้า และเอกสารในหน้านี้เป็นข้อมูลจำลอง เก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น ยังไม่เชื่อม Google Sheet</p>
      <div><button class="btn" id="reset">รีเซ็ตกลับเป็นข้อมูลตัวอย่าง</button></div></div></div>`;
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { pref.palette = b.dataset.p; applyTheme(); viewSettings(); });
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { pref.mode = b.dataset.m; applyTheme(); viewSettings(); });
  $('#reset').onclick = () => {
    if ($('#reset').dataset.confirm) { db = seed(); save(); draft = null; toast('รีเซ็ตข้อมูลตัวอย่างแล้ว'); go('docs'); }
    else { $('#reset').dataset.confirm = 1; $('#reset').textContent = 'กดอีกครั้งเพื่อยืนยันการรีเซ็ต'; }
  };
}

/* ---------- Boot ---------- */
try { Object.assign(pref, JSON.parse(localStorage.getItem('qs-theme')) || {}); } catch (e) {}
applyTheme(); load(); render();
</script>
</body>
</html>
