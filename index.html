<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ระบบใบเสนอราคา – ทดสอบ</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: top app bar + 4-stage pipeline stepper (QT → IV → DO → RC); each stage lists document cards; detail = paper + action/timeline panel */
  :root {
    --ocean-l: #2563eb; --ocean-d: #7aa7ff; --ocean-2: #06b6d4;
    --forest-l: #059669; --forest-d: #5ee0b0; --forest-2: #84cc16;
    --sunset-l: #ea580c; --sunset-d: #ffa86b; --sunset-2: #e11d48;
    --plum-l: #7c3aed; --plum-d: #b9a0ff; --plum-2: #db2777;
    --acc-l: var(--ocean-l); --acc-d: var(--ocean-d); --acc-2: var(--ocean-2);

    --bg: #f5f6fa; --surface: #ffffff; --surface-2: #f1f3f8; --fg: #121826; --muted: #667085; --line: #e6e8ef;
    --accent: var(--acc-l); --accent-fg: #ffffff;
    --accent-soft: color-mix(in srgb, var(--accent) 10%, var(--surface));
    --ok: #12805c; --warn: #b54708; --bad: #c0362c; --idle: #475467;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
    --shadow: 0 1px 3px rgba(16,24,40,.06), 0 12px 32px -12px rgba(16,24,40,.14);
    --font: 'Anuphan', 'Tahoma', sans-serif;
    --r: 16px;
  }
  :root[data-palette="forest"] { --acc-l: var(--forest-l); --acc-d: var(--forest-d); --acc-2: var(--forest-2); }
  :root[data-palette="sunset"] { --acc-l: var(--sunset-l); --acc-d: var(--sunset-d); --acc-2: var(--sunset-2); }
  :root[data-palette="plum"]   { --acc-l: var(--plum-l);   --acc-d: var(--plum-d);   --acc-2: var(--plum-2); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0c0f16; --surface: #151a24; --surface-2: #1c2230; --fg: #eef1f7; --muted: #98a2b3; --line: #262e3d;
    --accent: var(--acc-d); --accent-fg: #0b0f17; --ok: #5fd4a5; --warn: #f7b267; --bad: #ff8a80; --idle: #aab4c3;
    --shadow-sm: none; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 36px -16px rgba(0,0,0,.6); color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #0c0f16; --surface: #151a24; --surface-2: #1c2230; --fg: #eef1f7; --muted: #98a2b3; --line: #262e3d;
    --accent: var(--acc-d); --accent-fg: #0b0f17; --ok: #5fd4a5; --warn: #f7b267; --bad: #ff8a80; --idle: #aab4c3;
    --shadow-sm: none; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 36px -16px rgba(0,0,0,.6); color-scheme: dark }

  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100%; color: var(--fg); font: 15px/1.6 var(--font);
    background: radial-gradient(1200px 420px at 10% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
                radial-gradient(900px 380px at 100% -5%, color-mix(in srgb, var(--acc-2) 12%, transparent), transparent 70%), var(--bg);
    background-attachment: fixed; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 80%, transparent); }
  h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.01em; }
  h1 { font-size: clamp(1.4rem, 3.5vw, 1.8rem); font-weight: 700; }
  h2 { font-size: 1.05rem; font-weight: 600; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); } .sm { font-size: .84rem; }
  .wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* App bar */
  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
    background: color-mix(in srgb, var(--bg) 72%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
  .bar-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; border: 0; background: none; cursor: pointer; padding: 0; text-align: left; }
  .logo { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: #fff; font-weight: 700;
    background: linear-gradient(135deg, var(--acc-l), var(--acc-2)); box-shadow: 0 6px 16px -6px var(--acc-l); }
  .brand b { display: block; line-height: 1.2; } .brand small { color: var(--muted); font-size: .75rem; }
  .tools { display: flex; gap: 4px; }
  .tool { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: none; border-radius: 999px; padding: 7px 12px; cursor: pointer; color: var(--muted); font-weight: 500; }
  .tool:hover { background: var(--surface); border-color: var(--line); color: var(--fg); }
  .tool[aria-current="page"] { background: var(--surface); border-color: var(--line); color: var(--accent); box-shadow: var(--shadow-sm); }
  .tool svg { width: 18px; height: 18px; }

  /* Pipeline stepper */
  .pipe { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 10px; overflow-x: auto; padding: 18px 2px 4px; scrollbar-width: none; }
  .stage { position: relative; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; cursor: pointer;
    display: grid; gap: 2px; box-shadow: var(--shadow-sm); transition: transform .15s, box-shadow .15s, border-color .15s; }
  .stage:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .stage .step { font-size: .72rem; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
  .stage b { font-size: 1rem; font-weight: 600; }
  .stage .cnt { font-size: .82rem; color: var(--muted); }
  .stage .cnt em { font-style: normal; color: var(--warn); font-weight: 600; }
  .stage[aria-current="page"] { border-color: transparent; color: #fff; background: linear-gradient(135deg, var(--acc-l), var(--acc-2)); box-shadow: 0 12px 28px -12px var(--acc-l); }
  .stage[aria-current="page"] .step, .stage[aria-current="page"] .cnt, .stage[aria-current="page"] .cnt em { color: rgba(255,255,255,.85); }
  .stage:not(:last-child)::after { content: "›"; position: absolute; right: -10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 1.1rem; z-index: 1; }

  main { padding-block: 18px 64px; }
  .view { display: grid; gap: 16px; }
  .head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .head p { margin: 2px 0 0; color: var(--muted); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-sm); padding: 18px; display: grid; gap: 14px; min-width: 0; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  label.f { display: grid; gap: 5px; font-size: .84rem; color: var(--muted); font-weight: 500; }
  input, select, textarea { background: var(--surface-2); border: 1px solid transparent; border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0; transition: border-color .15s, background .15s; }
  input:hover, select:hover, textarea:hover { border-color: var(--line); }
  input:focus, select:focus, textarea:focus { outline: none; background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  textarea { resize: vertical; min-height: 64px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; padding: 10px 18px; cursor: pointer; font-weight: 600;
    border: 1px solid var(--line); background: var(--surface); white-space: nowrap; transition: transform .1s, box-shadow .15s, border-color .15s; }
  .btn:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .btn:active { transform: scale(.98); }
  .btn.primary { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--acc-l), color-mix(in srgb, var(--acc-l) 60%, var(--acc-2))); box-shadow: 0 8px 20px -10px var(--acc-l); }
  .btn.ok { color: #fff; border-color: transparent; background: linear-gradient(135deg, #12805c, #22a06b); box-shadow: 0 8px 20px -10px #12805c; }
  .btn.danger { color: var(--bad); }
  .btn.small { padding: 6px 12px; font-size: .84rem; }
  .btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 4px; }
  .icon-btn { border: 0; background: none; cursor: pointer; color: var(--muted); width: 32px; height: 32px; border-radius: 10px; }
  .icon-btn:hover { color: var(--bad); background: var(--surface-2); }

  .seg { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 999px; overflow-x: auto; max-width: 100%; }
  .seg button { flex: none; border: 0; background: none; border-radius: 999px; padding: 6px 14px; cursor: pointer; color: var(--muted); font-weight: 500; font-size: .88rem; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm), 0 0 0 1px var(--line); }

  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap;
    background: color-mix(in srgb, currentColor 12%, transparent); }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .s-pending { color: var(--warn); } .s-finish { color: var(--ok); } .s-cancel { color: var(--bad); } .s-issued { color: var(--accent); }

  /* Document cards */
  .docs { display: grid; gap: 10px; }
  .doc { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 14px 16px; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform .15s, box-shadow .15s; }
  .doc:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .avatar { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-weight: 700; color: var(--accent); background: var(--accent-soft); }
  .doc .t { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .doc .t b { font-weight: 600; }
  .doc .right { display: grid; justify-items: end; gap: 6px; }
  .doc .amt { font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .doc .acts { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .doc .acts:empty { display: none; }
  .code { font-size: .78rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; border: 1px dashed var(--line); border-radius: var(--r); }

  .stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow-sm); }
  .stat b { display: block; font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: .82rem; }

  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: .78rem; font-weight: 600; color: var(--muted); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
  .tag { font-size: .72rem; font-weight: 600; letter-spacing: .03em; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 6px; }

  /* Pickers */
  .picker { position: relative; }
  .menu { position: absolute; z-index: 25; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); max-height: 300px; overflow-y: auto; padding: 6px; }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border: 0; background: none; border-radius: 10px; cursor: pointer; color: var(--fg); font-weight: 400; }
  .opt:hover { background: var(--accent-soft); }
  .opt.add { color: var(--accent); font-weight: 600; }
  .selcust { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: var(--accent-soft); }
  .selcust > div { flex: 1 1 220px; min-width: 0; }
  .addline { display: grid; grid-template-columns: 1fr 100px auto; gap: 10px; align-items: end; }
  .lines input { padding: 7px 10px; }
  .lines .q { width: 90px; } .lines .p { width: 130px; }
  .totals { display: grid; gap: 6px; width: 100%; max-width: 360px; margin-left: auto; }
  .totals div { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
  .totals .grand { border-top: 1px solid var(--line); padding-top: 10px; font-size: 1.15rem; font-weight: 700; }
  .totals .grand span:last-child { color: var(--accent); }
  .words { text-align: right; color: var(--muted); font-size: .9rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }

  /* Detail */
  .detail { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  .panel { position: sticky; top: calc(80px + env(safe-area-inset-top, 0px)); display: grid; gap: 12px; }
  .timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
  .timeline li { position: relative; padding: 0 0 16px 26px; }
  .timeline li::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: -6px; width: 2px; background: var(--line); }
  .timeline li:last-child::before { display: none; }
  .timeline li::after { content: ""; position: absolute; left: 0; top: 5px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
  .timeline li.done::after { background: var(--ok); border-color: var(--ok); }
  .timeline li.cur::after { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .timeline li.cancel::after { background: var(--bad); border-color: var(--bad); }
  .timeline a { color: inherit; text-decoration: none; font-weight: 600; cursor: pointer; }
  .timeline a:hover { color: var(--accent); }
  .paper { background: #ffffff; color: #121826; border-radius: 14px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 44px); display: grid; gap: 22px; position: relative; overflow: hidden; }
  .paper::before { content: ""; position: absolute; inset: 0 0 auto; height: 6px; background: linear-gradient(90deg, var(--acc-l), var(--acc-2)); }
  .paper .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; }
  .paper h2 { font-size: 1.45rem; font-weight: 700; color: var(--acc-l); }
  .paper .muted { color: #667085; }
  .paper th { color: #667085; border-color: #e6e8ef; } .paper td { border-color: #eef0f4; }
  .paper .meta { display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-size: .9rem; align-content: start; }
  .paper .totals div { color: #121826; } .paper .totals .grand span:last-child { color: var(--acc-l); } .paper .totals .grand { border-color: #e6e8ef; }
  .stamp { position: absolute; right: 28px; top: 90px; transform: rotate(-12deg); border: 3px solid currentColor; border-radius: 10px; padding: 4px 14px; font-weight: 700; font-size: 1.1rem; opacity: .75; pointer-events: none; }
  .stamp.finish { color: #12805c; } .stamp.cancel { color: #c0362c; }
  .signs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 24px; padding-top: 28px; }
  .signs div { border-top: 1px dashed #b8c0cc; padding-top: 6px; text-align: center; font-size: .85rem; color: #667085; }

  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; }
  .sw i { width: 28px; height: 28px; border-radius: 50%; display: block; }
  .sw[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  dialog { border: 1px solid var(--line); border-radius: 20px; padding: 0; background: var(--surface); color: var(--fg); width: min(540px, calc(100% - 32px)); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(8, 12, 20, .5); backdrop-filter: blur(3px); }
  dialog form { padding: 22px; display: grid; gap: 14px; }
  .toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    background: var(--fg); color: var(--bg); padding: 11px 18px; border-radius: 999px; max-width: calc(100% - 32px); box-shadow: var(--shadow); font-weight: 500; }

  @media (max-width: 900px) { .detail { grid-template-columns: 1fr; } .panel { position: static; order: -1; } }
  @media (max-width: 640px) {
    .tool span { display: none; } .brand small { display: none; }
    .pipe { grid-template-columns: repeat(4, 150px); margin-inline: -4px; }
    .doc { grid-template-columns: auto minmax(0, 1fr); }
    .doc .right { grid-column: 2; justify-items: start; grid-auto-flow: column; align-items: center; justify-content: space-between; }
    .doc .acts { grid-column: 1 / -1; } .doc .acts .btn { flex: 1; }
    .hide-sm { display: none; }
    .addline { grid-template-columns: 1fr 80px; } .addline .btn { grid-column: 1 / -1; }
    .lines thead { display: none; }
    .lines tr { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .lines td { border: 0; padding: 0; } .lines td.n { grid-column: 1 / -1; } .lines .q, .lines .p { width: 100%; }
    .actions .btn { flex: 1; }
  }
  @media (prefers-reduced-motion: no-preference) { .view { animation: rise .22s ease-out; } @keyframes rise { from { opacity: .3; transform: translateY(6px); } } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="top"><div class="wrap bar-in">
  <button class="brand" data-go="list" data-p="QT" type="button"><span class="logo">QS</span><span><b>ระบบออกเอกสาร</b><small>เวอร์ชันทดสอบ · ข้อมูลจำลอง</small></span></button>
  <nav class="tools" aria-label="ฐานข้อมูลและการตั้งค่า">
    <button class="tool" data-go="customers" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c2 .7 3.2 2.5 3.6 5.2"/></svg><span>ลูกค้า</span></button>
    <button class="tool" data-go="products" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg><span>สินค้า</span></button>
    <button class="tool" data-go="settings" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg><span>ธีม</span></button>
  </nav>
</div></header>

<div class="wrap"><div class="pipe" id="pipe"></div></div>
<main class="wrap" id="main"></main>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Workflow definition ---------- */
const FLOW = ['QT', 'IV', 'DO', 'RC'];
const TYPES = {
  QT: { name: 'ใบเสนอราคา', short: 'เสนอราคา', extra: 'ยืนราคาถึง',
        st: { issued: 'ออกใบเสนอราคาแล้ว', finish: 'ลูกค้าสั่งซื้อแล้ว' }, open: 'issued',
        next: { label: 'ลูกค้าสั่งซื้อ', done: 'ขายสำเร็จ ส่งต่อไปใบแจ้งหนี้แล้ว' } },
  IV: { name: 'ใบแจ้งหนี้', short: 'แจ้งหนี้', extra: 'ครบกำหนดชำระ',
        st: { pending: 'รอส่งของ', finish: 'ส่งต่อไปส่งของแล้ว', cancel: 'ยกเลิก' }, open: 'pending', cancel: true,
        next: { label: 'ไปขั้นส่งของ', done: 'ส่งต่อไปใบส่งของแล้ว' } },
  DO: { name: 'ใบส่งของ', short: 'ส่งของ', extra: 'วันที่ส่งของ',

  if (num >= 1e6) return thaiNum(Math.floor(num / 1e6), hasHigher) + 'ล้าน' + thaiNum(num % 1e6, true);
  const s = String(num); let o = '';

function totalsRows(d, t) {

}

function syncDraft() { draft.project = $('#project').value; draft.date = $('#date').value || draft.date; draft.extra = $('#extra').value; draft.remark = $('#remark').value; }
function drawCust() {

function setupProductPicker() {
  const inp = $('#ps'), menu = $('#pm'); let chosen = null;
  const show = () => {
    const q = inp.value.trim().toLowerCase(); chosen = null;
    const res = db.products.filter(p => !q || (p.name + p.code).toLowerCase().includes(q)).slice(0, 8);
    menu.innerHTML = res.map(p => `<button type="button" class="opt" data-id="${p.id}"><span>${esc(p.name)}<div class="muted sm">${esc(p.code)} · ${esc(p.unit)}</div></span><span class="num">฿${money(p.price)}</span></button>`).join('')
      + `<button type="button" class="opt add" data-new="1">+ ${q && !res.length ? `เพิ่ม “${esc(inp.value.trim())}” เป็นสินค้าใหม่` : 'เพิ่มสินค้าใหม่เข้าฐานข้อมูล'}</button>`;
    menu.hidden = false;
    $$('[data-id]', menu).forEach(b => b.onmousedown = e => { e.preventDefault(); chosen = db.products.find(p => p.id === b.dataset.id); inp.value = chosen.name; menu.hidden = true; $('#pq').focus(); $('#pq').select(); });

  const add = () => {
    const v = inp.value.trim().toLowerCase();
    if (!chosen) chosen = db.products.find(p => p.name.toLowerCase() === v || p.code.toLowerCase() === v);

function addLine(p) {
  const qty = +$('#pq').value || 1;
  const ex = draft.lines.find(l => l.pid === p.id && l.price === p.price);
  if (ex) ex.qty += qty; else draft.lines.push({ pid: p.id, name: p.name, unit: p.unit, qty, price: p.price });
  $('#pq').value = 1; drawLines(); toast(`เพิ่ม ${p.name} แล้ว`);
}
function drawLines() {
  $('#lines').innerHTML = draft.lines.map((l, i) => `<tr>
    <td class="n"><b style="font-weight:600">${esc(l.name)}</b><div class="muted sm">${esc(l.unit)}</div></td>
    <td class="num"><input class="q num" type="number" min="0" step="any" value="${l.qty}" data-i="${i}" data-k="qty" aria-label="จำนวน"></td>
    <td class="num"><input class="p num" type="number" min="0" step="0.01" value="${l.price}" data-i="${i}" data-k="price" aria-label="ราคาต่อหน่วย"></td>

    <td><button class="icon-btn" data-del="${i}" type="button" aria-label="ลบรายการ">✕</button></td></tr>`).join('')
    || `<tr><td colspan="5"><div class="empty">ยังไม่มีรายการ · ค้นหาสินค้าด้านบนแล้วกด “เพิ่มรายการ”</div></td></tr>`;
  $$('#lines input').forEach(inp => inp.oninput = () => {
    const l = draft.lines[inp.dataset.i]; l[inp.dataset.k] = +inp.value || 0;
    inp.closest('tr').querySelector('.amt').textContent = money(l.qty * l.price); drawTotals();
  });
  $$('[data-del]').forEach(b => b.onclick = () => { draft.lines.splice(+b.dataset.del, 1); drawLines(); });
  drawTotals();
}
function drawTotals() { const t = totals(draft); $('#tot').innerHTML = totalsRows(draft, t); $('#words').textContent = `(${bahtText(t.grand)})`; }
function commit() {
  syncDraft();
  if (!cust(draft.custId)) { toast('กรุณาเลือกลูกค้าจากฐานข้อมูล'); $('#cs')?.focus(); return; }
  if (!draft.lines.length) { toast('กรุณาเพิ่มรายการอย่างน้อย 1 รายการ'); $('#ps').focus(); return; }
  const doc = { ...draft, type: 'QT', no: nextDocNo('QT', draft.date), status: 'issued', discount: +draft.discount || 0 };
  db.docs.push(doc); save(); draft = null;
  toast(`ออกใบเสนอราคา ${doc.no} แล้ว`);
  go('doc', doc.no);
}

/* ---------- Dialog ---------- */
function openDialog(html, onSave) {
  const dlg = $('#dlg'), f = $('#dlgForm');
  f.innerHTML = html + `<div class="actions"><button class="btn" value="cancel" formnovalidate>ยกเลิก</button><button class="btn primary" value="ok">บันทึกลงฐานข้อมูล</button></div>`;
  f.onsubmit = e => {
    if (e.submitter?.value !== 'ok') return;
    e.preventDefault();
    if (!f.reportValidity()) return;
    const data = Object.fromEntries(new FormData(f)); Object.keys(data).forEach(k => data[k] = String(data[k]).trim());
    dlg.close(); onSave(data);
  };
  dlg.showModal(); f.querySelector('input')?.focus();
}

    <div class="card"><h2>สีธีม</h2><div class="swatches">${Object.entries(PALETTES).map(([k, [n, v]]) => `<button class="sw" data-pal="${k}" aria-pressed="${pref.palette === k}" type="button"><i style="background:linear-gradient(135deg,var(--${v}-l),var(--${v}-2))"></i>${n}</button>`).join('')}</div></div>
    <div class="card"><h2>โหมดแสดงผล</h2><div><div class="seg">${[['system', 'ตามเครื่อง'], ['light', 'สว่าง'], ['dark', 'มืด']].map(([k, n]) => `<button data-m="${k}" aria-pressed="${pref.mode === k}" type="button">${n}</button>`).join('')}</div></div></div>
    <div class="card"><h2>ข้อมูลทดสอบ</h2><p class="muted sm" style="margin:0">ลูกค้า สินค้า และเอกสารเป็นข้อมูลจำลอง เก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น ยังไม่เชื่อม Google Sheet</p>
      <div><button class="btn" id="reset" type="button">รีเซ็ตกลับเป็นข้อมูลตัวอย่าง</button></div></div></div>`;
  $$('[data-pal]').forEach(b => b.onclick = () => { pref.palette = b.dataset.pal; applyTheme(); viewSettings(); });
  $$('[data-m]').forEach(b => b.onclick = () => { pref.mode = b.dataset.m; applyTheme(); viewSettings(); });
  $('#reset').onclick = () => {
    if ($('#reset').dataset.confirm) { db = seed(); save(); draft = null; toast('รีเซ็ตข้อมูลตัวอย่างแล้ว'); go('list', 'QT'); }
    else { $('#reset').dataset.confirm = 1; $('#reset').textContent = 'กดอีกครั้งเพื่อยืนยันการรีเซ็ต'; }
  };
}

/* ---------- Boot ---------- */
try { Object.assign(pref, JSON.parse(localStorage.getItem('qs-theme')) || {}); } catch (e) {}
applyTheme(); load(); render();
</script>
</body>
</html>
