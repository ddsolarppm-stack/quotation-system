<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบใบเสนอราคา – ทดสอบ</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Sarabun', sans-serif; background: #f4f6f9; color: #222; padding: 16px;
    }
    .card {
      background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08);
      padding: 32px 24px; text-align: center; width: 100%; max-width: 480px;
    }
    h1 { font-size: clamp(1.4rem, 5vw, 2rem); margin: 0 0 16px; color: #1a5fb4; }
    #now { font-size: clamp(1rem, 4vw, 1.25rem); }
  </style>
</head>
<body>
  <div class="card">
    <h1>ระบบใบเสนอราคา – ทดสอบ</h1>
    <div id="now"></div>
  </div>
  <script>
    function tick() {
      document.getElementById('now').textContent = new Date().toLocaleString('th-TH', {
        dateStyle: 'full', timeStyle: 'medium'
      });
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
